name: ReplyAssistant
options:
  bundleIdPrefix: com.lengmo
  deploymentTarget:
    iOS: "15.0"
targets:
  ReplyAssistant:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - target: ReplyBroadcast
        embed: true
      - target: ReplyKeyboard
        embed: true
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.lengmo.ReplyAssistant
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "回话助手"
        CFBundleShortVersionString: "4.0.0"
        CFBundleVersion: "6"
        NSHumanReadableCopyright: "© 2026 LengMo"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "选择聊天截图，用本地 OCR 提取对话给 AI 起草回复"
        UIBackgroundModes:
          - audio
  ReplyBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: ExtSources
      - path: Sources/Shared.swift
    settings:
      SWIFT_VERSION: "5.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.lengmo.ReplyAssistant.ReplyBroadcast
    info:
      path: ExtSources/Info.plist
      properties:
        CFBundleDisplayName: "回话直播"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
        RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
  ReplyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeySources
      - path: Sources/Shared.swift
    settings:
      SWIFT_VERSION: "5.0"
      PRODUCT_BUNDLE_IDENTIFIER: com.lengmo.ReplyAssistant.ReplyKeyboard
    info:
      path: KeySources/Info.plist
      properties:
        CFBundleDisplayName: "回话键盘"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: "zh-Hans"
            RequestsOpenAccess: true
